defaults:
- dataset: re10k
- optional dataset/view_sampler_dataset_specific_config: ${dataset/view_sampler}_${dataset}
- model/encoder: depthsplat
- model/decoder: splatting_cuda
- loss:
  - mse
- _self_
wandb:
  project: pavesplat
  entity: null
  name: pavesplat
  mode: online
  id: null
mode: train
dataset:
  overfit_to_scene: null
data_loader:
  train:
    num_workers: 10
    persistent_workers: true
    batch_size: 4
    seed: 1234
  test:
    num_workers: 4
    persistent_workers: false
    batch_size: 1
    seed: 2345
  val:
    num_workers: 1
    persistent_workers: true
    batch_size: 1
    seed: 3456
optimizer:
  lr: 0.0002
  lr_monodepth: 2.0e-06
  warm_up_steps: 2000
  weight_decay: 0.01
checkpointing:
  load: null
  every_n_train_steps: 5000
  save_top_k: 5
  pretrained_model: null
  pretrained_monodepth: null
  pretrained_mvdepth: null
  pretrained_depth: null
  no_strict_load: false
  resume: false
train:
  depth_mode: null
  extended_visualization: false
  print_log_every_n_steps: 100
  eval_model_every_n_val: 2
  eval_data_length: 999999
  eval_deterministic: false
  eval_time_skip_steps: 3
  eval_save_model: true
  l1_loss: false
  intermediate_loss_weight: 0.9
  no_viz_video: false
  viz_depth: false
  forward_depth_only: false
  train_ignore_large_loss: 0.0
  no_log_projections: false
  hrrc_val: false
  hrrc_val_scenes: 32
  hrrc_gt_mode: bicubic
test:
  output_path: outputs/test
  compute_scores: true
  eval_time_skip_steps: 0
  save_image: false
  save_video: false
  save_gt_image: false
  save_input_images: false
  save_depth: false
  save_depth_npy: false
  save_depth_concat_img: false
  save_gaussian: false
  render_chunk_size: null
  stablize_camera: false
  stab_camera_kernel: 50
  eval_normal_error: false
  save_eval_plots: false
  eval_min_depth: 0.5
  eval_max_depth: 10.0
  normal_edge_rel_thresh: 0.05
  normal_min_norm: 0.1
  hrrc_eval_8x_only: false
  eval_coverage: false
  coverage_taus:
  - 0.01
  - 0.05
  - 0.1
  - 0.5
  save_scene_names: null
  save_ellipsoids: false
  ellipsoid_sigmas:
  - 1.0
  - 2.0
  - 3.0
  ellipsoid_color_mode: scene
  ellipsoid_opacity_min: 0.05
  ellipsoid_scale: 8
  ellipsoid_bg:
  - 1.0
  - 1.0
  - 1.0
  black_eps_sweep:
  - 0.01
  - 0.02
  - 0.05
  save_normal_npz: false
seed: 111123
trainer:
  max_steps: -1
  val_check_interval: 0.5
  limit_val_batches: null
  gradient_clip_val: 0.5
  num_sanity_val_steps: 2
  accumulate_grad_batches: 1
output_dir: outputs/tmp
use_plugins: false
